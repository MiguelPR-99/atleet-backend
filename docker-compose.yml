version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atleet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-atleet_db}
    ports:
      - '5432:5432'
    volumes:
      - atleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atleet} -d ${POSTGRES_DB:-atleet_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atleet_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@atleet.mx}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  atleet_postgres_data:
    driver: local
